<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Generate a QR code from any text or URL in seconds. Free, no login, browser-based tool by thisqr.works (thisqrworks)." />
		<meta
			name="keywords"
			content="qr code generator, text to qr, url to qr, free qr maker, thisqrworks, this qr works, working qr" />
		<meta name="robots" content="index, follow" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="thisqr.works" />
		<meta property="og:title" content="QR Generator | thisqr.works" />
		<meta
			property="og:description"
			content="Paste text or URL, generate QR, download SVG. No login." />
		<meta property="og:url" content="https://thisqr.works/qr/" />
		<meta name="twitter:card" content="summary" />
		<link rel="canonical" href="https://thisqr.works/qr/" />
		<title>QR Generator - Text or URL to QR | thisqr.works</title>
		<link rel="stylesheet" href="style.css" />
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "SoftwareApplication",
				"name": "QR Code Generator",
				"applicationCategory": "UtilitiesApplication",
				"operatingSystem": "Any",
				"offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
				"description": "Free QR code generator for text or URLs. No login.",
				"url": "https://thisqr.works/qr/"
			}
		</script>
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "BreadcrumbList",
				"itemListElement": [
					{
						"@type": "ListItem",
						"position": 1,
						"name": "Home",
						"item": "https://thisqr.works/"
					},
					{
						"@type": "ListItem",
						"position": 2,
						"name": "QR Generator",
						"item": "https://thisqr.works/qr/"
					}
				]
			}
		</script>
	</head>
	<body>
		<header class="site-header" role="banner">
			<div class="brand-mark" aria-label="thisqr.works">
				<a href="/" class="brand-link">thisqr.works</a>
			</div>
			<nav class="header-nav" aria-label="Tools">
				<a class="quiet-link" href="/decode/">Decode QR</a>
				<a class="quiet-link" href="/custom/">Custom QR</a>
			</nav>
		</header>

		<main class="content" role="main">
			<section class="create-card" aria-live="polite">
				<h1 class="card-title">QR Code Generator</h1>
				<p class="card-lede">
					Paste text or a URL. Generate a QR code instantly.
				</p>

				<div class="field-group" style="margin-bottom: 1.25rem">
					<label class="field-label" for="qr-input">Text or URL</label>
					<textarea
						class="text-input text-area"
						id="qr-input"
						name="qr-input"
						rows="3"
						placeholder="https://example.com or any text..."
						autocomplete="off"
						spellcheck="false"></textarea>
				</div>

				<div class="actions">
					<button class="button" id="generate-btn" type="button">
						Generate QR
					</button>
					<button class="ghost-button" id="clear-btn" type="button">
						Clear
					</button>
					<span class="muted-note" id="status-note">Ready.</span>
				</div>

				<div id="results" hidden>
					<div class="qr-panel">
						<p class="muted-note" id="qr-caption">QR code.</p>
						<div class="qr-preview" id="qr-preview" aria-live="polite"></div>
						<div class="actions">
							<button class="ghost-button" id="download-svg" type="button">
								Download SVG
							</button>
							<button class="ghost-button" id="copy-svg" type="button">
								Copy SVG
							</button>
							<a class="ghost-button" id="customize-link" href="/custom/">
								Customize QR
							</a>
						</div>
					</div>
				</div>
			</section>
		</main>

		<footer class="site-footer" role="contentinfo">
			<p>
				<small>
					Contact
					<a class="footer-link" href="mailto:gollabharath2007@gmail.com">me</a>
					to show your ads here.
				</small>
			</p>
			<p>
				<small
					>Made with &#10084;&#65039; by
					<a class="footer-link" href="https://gollabharath.me"
						>Bharath</a
					></small
				>
			</p>
		</footer>

		<noscript>
			<p class="noscript">This page needs JavaScript to generate QR codes.</p>
		</noscript>

		<script src="qrcode.js"></script>
		<script src="/customize-link-helper.js"></script>
		<script src="script.js"></script>
	</body>
</html>
