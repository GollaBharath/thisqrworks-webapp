<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Open a social QR profile and access all shared links in one place. Fast, free viewer from thisqr.works." />
		<meta
			name="keywords"
			content="social qr viewer, qr profile page, social links qr, thisqrworks, this qr works" />
		<meta name="robots" content="index, follow" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="thisqr.works" />
		<meta
			property="og:title"
			content="Social QR Profile Viewer | thisqr.works" />
		<meta
			property="og:description"
			content="View social links from one QR profile page." />
		<meta property="og:url" content="https://thisqr.works/socials/" />
		<meta name="twitter:card" content="summary" />
		<link rel="canonical" href="https://thisqr.works/socials/" />
		<title>Social Media QR Profile Viewer | thisqr.works</title>
		<link rel="stylesheet" href="style.css" />
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "SoftwareApplication",
				"name": "Social Media QR Code Viewer",
				"applicationCategory": "UtilitiesApplication",
				"operatingSystem": "Any",
				"offers": {
					"@type": "Offer",
					"price": "0",
					"priceCurrency": "USD"
				},
				"description": "View social profile links from a QR payload.",
				"url": "https://thisqr.works/socials/"
			}
		</script>
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "BreadcrumbList",
				"itemListElement": [
					{
						"@type": "ListItem",
						"position": 1,
						"name": "Home",
						"item": "https://thisqr.works/"
					},
					{
						"@type": "ListItem",
						"position": 2,
						"name": "Social Media QR",
						"item": "https://thisqr.works/socials/"
					}
				]
			}
		</script>
	</head>
	<body>
		<header class="site-header" role="banner">
			<div class="brand-mark" aria-label="thisqr.works">
				<a href="/" class="brand-link">thisqr.works</a>
			</div>
			<a
				class="quiet-link"
				href="create.html"
				aria-label="Create your own social media QR code"
				>Create QR Code</a
			>
		</header>
		<section id="explainer">
			<h1>Social Media QR Viewer</h1>

			<p>Scan once and open all shared social links.</p>

			<details>
				<summary>How it works</summary>
				<p>Profile data is read from the QR payload and shown below.</p>
			</details>
		</section>

		<main id="profile" class="content" role="main" hidden>
			<section class="profile-card" aria-live="polite">
				<h2 class="card-title">Social Media Profile</h2>
				<p id="status-message" class="status-message">
					Loading profile data...
				</p>
				<ul id="profile-links" class="profile-links" hidden></ul>
			</section>
		</main>

		<footer class="site-footer" role="contentinfo">
			<p>
				<small>
					Contact
					<a class="footer-link" href="mailto:gollabharath2007@gmail.com">me</a>
					to show your ads here.
				</small>
			</p>
			<p>
				<small
					>Made with &#10084;&#65039; by
					<a class="footer-link" href="https://gollabharath.me"
						>Bharath</a
					></small
				>
			</p>
		</footer>

		<noscript>
			<p class="noscript">
				This page requires JavaScript to decode the QR profile.
			</p>
		</noscript>

		<script src="script.js"></script>
	</body>
</html>
