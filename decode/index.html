<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Decode any QR code by image upload or camera scan. Free, no login, and runs in your browser on thisqr.works." />
		<meta
			name="keywords"
			content="qr code decoder, scan qr, read qr code, qr reader online, thisqrworks, this qr works" />
		<meta name="robots" content="index, follow" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="thisqr.works" />
		<meta property="og:title" content="QR Decoder | thisqr.works" />
		<meta
			property="og:description"
			content="Upload or scan a QR code and read its content fast." />
		<meta property="og:url" content="https://thisqr.works/decode/" />
		<meta name="twitter:card" content="summary" />
		<link rel="canonical" href="https://thisqr.works/decode/" />
		<title>QR Code Decoder - Scan or Upload | thisqr.works</title>
		<link rel="stylesheet" href="style.css" />
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "SoftwareApplication",
				"name": "QR Code Decoder",
				"applicationCategory": "UtilitiesApplication",
				"operatingSystem": "Any",
				"offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
				"description": "Free QR decoder for image upload or camera scan.",
				"url": "https://thisqr.works/decode/"
			}
		</script>
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "BreadcrumbList",
				"itemListElement": [
					{
						"@type": "ListItem",
						"position": 1,
						"name": "Home",
						"item": "https://thisqr.works/"
					},
					{
						"@type": "ListItem",
						"position": 2,
						"name": "Decode QR",
						"item": "https://thisqr.works/decode/"
					}
				]
			}
		</script>
	</head>
	<body>
		<header class="site-header" role="banner">
			<div class="brand-mark" aria-label="thisqr.works">
				<a href="/" class="brand-link">thisqr.works</a>
			</div>
			<nav class="header-nav" aria-label="Tools">
				<a class="quiet-link" href="/qr/">Generate QR</a>
				<a class="quiet-link" href="/custom/">Custom QR</a>
			</nav>
		</header>

		<main class="content" role="main">
			<section class="create-card" aria-live="polite">
				<h1 class="card-title">QR Code Decoder</h1>
				<p class="card-lede">
					Upload an image or scan with your camera to read QR content.
				</p>

				<!-- Mode tabs -->
				<div class="tab-bar" role="tablist" aria-label="Input method">
					<button
						class="tab active"
						id="tab-upload"
						role="tab"
						aria-selected="true"
						aria-controls="panel-upload">
						Upload Image
					</button>
					<button
						class="tab"
						id="tab-camera"
						role="tab"
						aria-selected="false"
						aria-controls="panel-camera">
						Use Camera
					</button>
				</div>

				<!-- Upload panel -->
				<div id="panel-upload" role="tabpanel" aria-labelledby="tab-upload">
					<div
						class="drop-zone"
						id="drop-zone"
						tabindex="0"
						role="button"
						aria-label="Click or drag an image here to decode">
						<p class="drop-hint" id="drop-hint">
							Drop an image here, or click to browse
						</p>
						<input
							type="file"
							id="file-input"
							accept="image/*"
							class="visually-hidden"
							aria-label="Choose QR code image" />
					</div>
					<canvas
						id="decode-canvas"
						class="visually-hidden"
						aria-hidden="true"></canvas>
				</div>

				<!-- Camera panel -->
				<div
					id="panel-camera"
					hidden
					role="tabpanel"
					aria-labelledby="tab-camera">
					<div class="camera-wrap" id="camera-wrap">
						<video
							id="camera-view"
							autoplay
							muted
							playsinline
							aria-label="Camera feed"></video>
						<canvas id="camera-canvas" aria-hidden="true"></canvas>
						<div class="scan-overlay" aria-hidden="true">
							<div class="scan-frame"></div>
						</div>
					</div>
					<div class="actions" style="margin-top: 1rem">
						<button class="button" id="start-camera" type="button">
							Start Camera
						</button>
						<button class="ghost-button" id="stop-camera" type="button" hidden>
							Stop Camera
						</button>
						<span class="muted-note" id="camera-status"
							>Camera not started.</span
						>
					</div>
				</div>

				<!-- Result -->
				<div id="result-block" hidden>
					<div class="result-panel">
						<p class="result-label">Decoded content</p>
						<textarea
							class="text-input text-area mono-result"
							id="result-text"
							readonly
							rows="4"
							aria-label="Decoded QR content"></textarea>
						<div class="actions" style="margin-top: 0.75rem">
							<button class="ghost-button" id="copy-result" type="button">
								Copy
							</button>
							<a
								class="ghost-button"
								id="open-url"
								href="#"
								target="_blank"
								rel="noopener noreferrer"
								hidden
								>Open URL</a
							>
						</div>
					</div>
				</div>

				<p class="muted-note" id="status-note" style="margin-top: 0.75rem">
					Ready.
				</p>
			</section>
		</main>

		<footer class="site-footer" role="contentinfo">
			<p>
				<small>
					Contact
					<a class="footer-link" href="mailto:gollabharath2007@gmail.com">me</a>
					to show your ads here.
				</small>
			</p>
			<p>
				<small
					>Made with &#10084;&#65039; by
					<a class="footer-link" href="https://gollabharath.me"
						>Bharath</a
					></small
				>
			</p>
		</footer>

		<noscript>
			<p class="noscript">This page needs JavaScript to decode QR codes.</p>
		</noscript>

		<script src="jsqr.js"></script>
		<script src="script.js"></script>
	</body>
</html>
